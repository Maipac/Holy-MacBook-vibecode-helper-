name: Build

on:
  push:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: App bauen
        run: ./build.sh

      - name: Selbsttest
        run: '"build/Holy MacBook.app/Contents/MacOS/HolyMacBook" --diagnose'

      - name: App verpacken
        run: ditto -c -k --keepParent "build/Holy MacBook.app" HolyMacBook.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HolyMacBook
          path: HolyMacBook.zip

      # Vorübergehend: Kontrolle des Menüleisten-Symbols.
      - name: Probelauf mit Bildschirmfotos
        run: |
          set +e
          APP="build/Holy MacBook.app"
          mkdir shots
          sudo sh -c "$("$APP/Contents/MacOS/HolyMacBook" --print-setup-command)"
          open "$APP"; sleep 6
          osascript -e 'tell application "System Events" to tell process "HolyMacBook" to get {name, description} of every menu bar item of menu bar 2'
          screencapture -x shots/1-off.png
          osascript -e 'tell application "System Events" to tell process "HolyMacBook" to click checkbox 1 of group 1 of window 1'; sleep 3
          osascript -e 'tell application "System Events" to tell process "HolyMacBook" to get {name, description} of every menu bar item of menu bar 2'
          screencapture -x shots/2-on.png
          osascript -e 'tell application "Holy MacBook" to quit'; sleep 3
          pmset -g | grep -i sleepdisabled
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
